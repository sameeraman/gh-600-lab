# ============================================================
# Agentic CI Pipeline
#
# This is the NON-deterministic half of the pipeline. Every job here
# either invokes an agent or exists to feed one.
#
# Why is this a separate file from ci.yml?
#
#   ci.yml decides whether the change may merge and ship. Its answers
#   must be reproducible, so it may only contain deterministic tools.
#   This file produces advice. Agents are non-deterministic, they cost
#   money per run, and a bad day for the model must never be able to
#   block a release. Keeping them apart means the merge gate and the
#   advice have independent failure modes.
#
# Yes, build-and-test appears in both files, and on a pull request it
# runs twice. That is deliberate. The copy in ci.yml is the merge gate.
# The copy below exists to produce the .trx and coverage artifacts that
# the agents read. Sharing one copy across two workflows would mean
# workflow_run triggers and cross-workflow artifact downloads, which is
# considerably more machinery than one extra four-minute job is worth.
# Duplicated compute is the lesser evil; duplicated *authority* is not.
# ============================================================
name: Agentic CI Pipeline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      task:
        description: 'Task description for agents'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  copilot-requests: write
  pull-requests: write
  security-events: write
  models: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build API
        run: dotnet build src/api/TodoApi.csproj --configuration Release

      - name: Run API Tests
        run: |
          dotnet test src/api/Tests/TodoApi.Tests.csproj \
            --logger "trx;LogFileName=api-results.trx" \
            --results-directory ./test-results

      - name: Install Frontend Dependencies
        run: cd src/frontend && npm ci

      - name: Run Frontend Tests
        run: cd src/frontend && npm test

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results/
            src/frontend/coverage/
          retention-days: 7


  agent-review:
    needs: [build-and-test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent: [reviewer, security-scanner]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Run ${{ matrix.agent }} Agent
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          copilot --agent=${{ matrix.agent }} \
            -p "Analyze the changes in this PR. Focus on your specialization area. Report findings with severity and file paths." \
            --no-ask-user > "${{ matrix.agent }}-report.md"

      - name: Upload Agent Report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.agent }}-report
          path: ${{ matrix.agent }}-report.md
          retention-days: 7
          if-no-files-found: error

  e2e-tests:
    needs: [build-and-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start API
        env:
          ASPNETCORE_ENVIRONMENT: Development
          Authentication__RequireSignedTokens: 'false'
        run: |
          set -uo pipefail

          dotnet run \
            --project src/api/TodoApi.csproj \
            --configuration Release \
            --urls http://127.0.0.1:5000 \
            > /tmp/todo-api.log 2>&1 &

          api_pid=$!
          principal=$(printf '{"userId":"warmup"}' | base64 -w0)

          for i in $(seq 1 60); do
            if ! kill -0 "$api_pid" 2>/dev/null; then
              echo "::error::API process exited before becoming ready."
              cat /tmp/todo-api.log
              exit 1
            fi

            code=$(curl --silent \
              --output /dev/null \
              --write-out '%{http_code}' \
              --header "x-ms-client-principal: ${principal}" \
              http://127.0.0.1:5000/api/todo || true)

            if [ "$code" = "200" ]; then
              echo "API ready after ${i}s."
              exit 0
            fi

            echo "API readiness attempt ${i} returned HTTP ${code}."
            sleep 1
          done

          echo "::error::API failed to start."
          cat /tmp/todo-api.log
          exit 1

      - name: Install Frontend & Playwright
        run: |
          cd src/frontend
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: cd src/frontend && npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: src/frontend/playwright-report/
          retention-days: 7

  consolidate:
    needs: [agent-review, e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download All Reports
        uses: actions/download-artifact@v4.1.3
        with:
          path: reports/

      - name: Normalize Reports Directory Permissions
        run: |
          mkdir -p reports
          chmod -R u+rwX reports

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: AI-Consolidated Summary
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          copilot -p "Read the report files already present under ./reports/ and return only a concise markdown executive summary for the pull request comment. Do not create files. Do not run shell commands. The workflow will save your stdout to reports/executive-summary.md. Include: overall risk level, blocking issues, advisory items, and a merge recommendation." \
            --allow-tool='read,search' \
            --no-ask-user > reports/executive-summary.md

      - name: Post Summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('reports/executive-summary.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 Agentic CI Summary\n\n${summary}`
            });

      - name: Write Step Summary
        run: |
          {
            echo "## 🤖 Agentic CI Consolidated Report"
            echo ""
            cat reports/executive-summary.md
          } >> "$GITHUB_STEP_SUMMARY"